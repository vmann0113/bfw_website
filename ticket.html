<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>모바일 입장권 | 2026 부산패션위크</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0B2E9E" />
<link rel="icon" href="images/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root {
    --navy: #0B2E9E; --deep: #0a2472; --ink: #16204a; --mute: #6b7593;
    --line: #dde3ef; --ok: #17b6a0; --bg: #eef2fa;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    padding: 18px 14px 40px;
  }
  .wrap { max-width: 460px; margin: 0 auto; }

  .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .brand { font-family: "Playfair Display", serif; font-weight: 900; font-size: 1.15rem; letter-spacing: .02em; color: var(--navy); }
  .brand span { font-family: "Space Mono", monospace; font-weight: 400; font-size: .62rem;
    letter-spacing: .18em; color: var(--mute); display: block; margin-top: 2px; }
  /* 실시간 시계 — 캡처본에는 시간이 멈춰 있으므로 스태프가 구분할 수 있다 */
  .clock { font-family: "Space Mono", monospace; font-size: .82rem; font-weight: 700;
    color: var(--navy); background: #fff; border: 1.5px solid var(--line);
    border-radius: 999px; padding: 5px 12px; }

  .ticket { position: relative; overflow: hidden; background: #fff;
    border-radius: 18px; border: 1.5px solid var(--line);
    box-shadow: 0 6px 26px rgba(20,35,90,.10); margin-bottom: 18px; }

  /* ── 도용 방지 : 위아래로 계속 흐르는 띠 ──
     화면을 캡처하면 띠가 멈추므로 스태프가 실제 화면인지 바로 구분한다. */
  .ticket::after {
    content: ""; position: absolute; left: 0; right: 0; height: 34%;
    background: linear-gradient(180deg,
      rgba(11,46,158,0) 0%, rgba(11,46,158,.13) 45%, rgba(23,182,160,.16) 55%, rgba(11,46,158,0) 100%);
    animation: sweep 2.6s linear infinite; pointer-events: none; z-index: 3;
  }
  @keyframes sweep { 0% { top: -34%; } 100% { top: 100%; } }

  .t-head { background: var(--navy); color: #fff; padding: 16px 18px; position: relative; z-index: 2; }
  .t-head .kicker { font-family: "Space Mono", monospace; font-size: .62rem;
    letter-spacing: .2em; opacity: .78; }
  .t-head h2 { margin: 5px 0 0; font-size: 1.24rem; line-height: 1.3; }
  .t-head .when { margin-top: 8px; font-family: "Space Mono", monospace;
    font-size: .92rem; font-weight: 700; letter-spacing: .02em; }

  .t-body { padding: 20px 18px 22px; position: relative; z-index: 2; text-align: center; }
  .qr { width: 210px; height: 210px; margin: 0 auto 14px; display: flex;
    align-items: center; justify-content: center; }
  .qr svg { width: 100%; height: 100%; }
  .code { font-family: "Space Mono", monospace; font-weight: 700; font-size: 1.05rem;
    letter-spacing: .06em; color: var(--navy); }
  .who { margin-top: 6px; font-size: .92rem; color: var(--mute); }
  .rows { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 14px;
    display: grid; gap: 7px; text-align: left; font-size: .88rem; }
  .rows div { display: flex; justify-content: space-between; gap: 12px; }
  .rows dt { color: var(--mute); }
  .rows dd { margin: 0; font-weight: 600; text-align: right; }

  .badge { display: inline-block; margin-top: 14px; padding: 7px 16px; border-radius: 999px;
    font-size: .84rem; font-weight: 700; }
  .badge.ok { background: rgba(23,182,160,.13); color: #0d7d6d; }
  .badge.used { background: rgba(107,117,147,.14); color: var(--mute); }

  .note { font-size: .84rem; color: var(--mute); line-height: 1.75; margin-top: 6px; }
  .note b { color: var(--ink); }
  .msg { background: #fff; border: 1.5px solid var(--line); border-radius: 16px;
    padding: 34px 20px; text-align: center; color: var(--mute); line-height: 1.7; }
  .msg a { color: var(--navy); }
  .foot { margin-top: 22px; text-align: center; font-size: .78rem; color: var(--mute); }
  .foot a { color: var(--navy); text-decoration: none; }

  @media (prefers-reduced-motion: reduce) {
    .ticket::after { animation-duration: 6s; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">BUSAN FASHION WEEK<span>MOBILE TICKET · 모바일 입장권</span></div>
    <div class="clock" id="clock">--:--:--</div>
  </div>

  <div id="list"><div class="msg">입장권을 불러오는 중…</div></div>

  <p class="note" id="guide" style="display:none">
    · 입구에서 이 화면을 <b>그대로</b> 보여주세요. 화면의 <b>띠가 위아래로 움직여야</b> 유효한 입장권입니다.<br>
    · 캡처 이미지는 띠가 멈춰 있어 입장이 제한될 수 있습니다.<br>
    · 시작 <b>20분 전</b>까지 입장해 주세요. 좌석은 <b>선착순</b>입니다.
  </p>

  <div class="foot">
    <a href="register.html">내 예약 조회</a> · <a href="index.html">부산패션위크 홈</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ticket.js"></script>
</body>
</html>
