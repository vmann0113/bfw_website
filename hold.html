<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>사전 좌석 확보 | 부산패션위크 2026</title>
<!-- 참여사에게만 보내는 링크다. 검색에 걸리면 안 된다. -->
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0a1a4a" />
<link rel="icon" href="images/favicon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  /* 이 화면 전용 스타일. css/styles.css 를 건드리지 않아 다른 페이지에 영향이 없다. */
  :root{
    --ink:#1b2340; --ink-mute:#6b7490; --line:#e3e7ef;
    --paper:#fff; --paper-2:#f6f8fc;
    --navy:#0b2e9e; --navy-soft:#eef2ff;
    --warn:#b26a00; --warn-soft:#fff7e8;
    --bad:#c0392b; --bad-soft:#fdeceb;
    --ok:#1f7a4d; --ok-soft:#e9f7f0;
    --mono:"Space Mono",ui-monospace,monospace;
    --kr:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper-2);color:var(--ink);font-family:var(--kr);
       -webkit-text-size-adjust:100%}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 16px 180px}

  .top{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 18px;
       box-shadow:0 1px 3px rgba(20,35,90,.05)}
  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
           color:var(--navy)}
  .top h1{margin:8px 0 2px;font-size:1.34rem;line-height:1.3;font-weight:800}
  .top .who{font-size:1.02rem;color:var(--ink-mute);margin-top:6px}
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{font-size:.8rem;padding:5px 10px;border-radius:999px;background:var(--paper-2);
        border:1px solid var(--line);color:var(--ink-mute)}
  .chip b{color:var(--ink);font-weight:700}

  .note{border-radius:12px;padding:14px 16px;margin-top:14px;font-size:.9rem;line-height:1.65}
  .note.info{background:var(--navy-soft);border:1px solid #d7e0ff;color:#26356e}
  .note.warn{background:var(--warn-soft);border:1px solid #f2e0bb;color:#7a4b00}
  .note.bad{background:var(--bad-soft);border:1px solid #f6cfcb;color:#8f261c}
  .note.ok{background:var(--ok-soft);border:1px solid #c9e8d8;color:#14603a}
  .note h4{margin:0 0 6px;font-size:.94rem}

  .board{margin-top:18px;background:var(--paper);border:1px solid var(--line);border-radius:14px;
         padding:18px 14px}
  .stage{text-align:center;font-family:var(--mono);font-size:.72rem;letter-spacing:.22em;
         color:var(--ink-mute);padding:8px 0 14px}
  .hall{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
  .side{display:flex;flex-direction:column;gap:14px;min-width:0}
  .runway{border-radius:10px;background:linear-gradient(180deg,#dfe6f7,#eef2ff);
          border:1px dashed #c3cfef;min-height:100%;display:flex;align-items:center;
          justify-content:center;width:46px}
  .runway span{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;color:#55639b;
               writing-mode:vertical-rl;transform:rotate(180deg)}

  .zone{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper)}
  .zone-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .zone-h b{font-size:.95rem}
  .zone-h .cnt{font-family:var(--mono);font-size:.72rem;color:var(--ink-mute)}
  .zbtns{display:flex;gap:5px}
  .zbtns button{font-size:.72rem;padding:4px 8px;border-radius:7px;border:1px solid var(--line);
                background:var(--paper-2);color:var(--ink-mute);cursor:pointer;font-family:var(--kr)}
  .zbtns button:hover:not(:disabled){border-color:var(--navy);color:var(--navy)}
  .zbtns button:disabled{opacity:.4;cursor:not-allowed}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .seat{font-family:var(--mono);font-size:.62rem;padding:0;height:26px;border-radius:5px;
        border:1px solid var(--line);background:var(--paper-2);color:var(--ink-mute);
        cursor:pointer;line-height:1}
  .seat:hover:not(:disabled){border-color:var(--navy);color:var(--navy)}
  .seat.mine{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
  .seat.other{background:#eceff6;border-color:#e0e4ee;color:#aab1c4;cursor:not-allowed}
  .seat.staff{background:var(--warn-soft);border-color:#f0dcae;color:#b98900;cursor:not-allowed}
  .seat.reserved{background:#e7eaf1;border-color:#e7eaf1;color:#9aa3b8;cursor:not-allowed}
  .seat:disabled{cursor:not-allowed}

  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:.78rem;color:var(--ink-mute)}
  .legend i{display:inline-block;width:13px;height:13px;border-radius:4px;border:1px solid var(--line);
            vertical-align:-2px;margin-right:5px}
  .legend .f{background:var(--paper-2)} .legend .m{background:var(--navy);border-color:var(--navy)}
  .legend .o{background:#eceff6} .legend .s{background:var(--warn-soft);border-color:#f0dcae}

  .form{margin-top:18px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
  .form h3{margin:0 0 4px;font-size:1rem}
  .form p.sub{margin:0 0 14px;font-size:.85rem;color:var(--ink-mute)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:block;font-size:.8rem;color:var(--ink-mute);margin-bottom:5px}
  input[type=text],input[type=tel]{width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:9px;font-family:var(--kr);font-size:.95rem;background:var(--paper)}
  input:focus{outline:none;border-color:var(--navy)}

  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);
       border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:20}
  .bar .in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;
           gap:14px;flex-wrap:wrap}
  .bar .n{font-size:.92rem}
  .bar .n b{font-family:var(--mono);font-size:1.16rem}
  .bar .n .sep{color:var(--line);margin:0 8px}
  .bar .acts{margin-left:auto;display:flex;gap:8px}
  .save{padding:12px 22px;border-radius:10px;border:0;background:var(--navy);color:#fff;
         font-family:var(--kr);font-size:.96rem;font-weight:700;cursor:pointer}
  .save:disabled{background:#aeb6c9;cursor:not-allowed}
  .ghost{padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);
         color:var(--ink-mute);font-family:var(--kr);font-size:.9rem;cursor:pointer}

  .msg{font-size:.86rem}
  .msg.err{color:var(--bad);font-weight:600}
  .msg.ok{color:var(--ok);font-weight:600}
  .loading{text-align:center;padding:70px 20px;color:var(--ink-mute)}

  @media (max-width:860px){
    .wrap{padding:18px 12px 200px}
    .hall{grid-template-columns:1fr auto 1fr;gap:6px}
    .runway{width:30px}
    .seat{height:24px;font-size:.58rem}
    .row{grid-template-columns:1fr}
    .zone-h{flex-wrap:wrap}
    /* 좁은 화면 : 숫자 줄 위, 버튼 줄 아래 (버튼은 반씩 나눠 누르기 쉽게) */
    .bar .in{gap:8px}
    .bar .n{width:100%}
    .bar .msg{width:100%}
    .bar .acts{width:100%;margin-left:0}
    .bar .acts button{flex:1}
  }
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="loading" id="loading">불러오는 중…</div>
  <div id="main" hidden>

    <div class="top">
      <div class="eyebrow">2026 부산패션위크 · 사전 좌석 확보</div>
      <h1 id="showTitle">—</h1>
      <div class="who" id="holderName">—</div>
      <div class="meta" id="meta"></div>
    </div>

    <div id="notices"></div>

    <div class="board" id="board">
      <div class="stage">← 무대 · STAGE</div>
      <div class="hall">
        <div class="side" id="sideL"></div>
        <div class="runway"><span>RUNWAY</span></div>
        <div class="side" id="sideR"></div>
      </div>
      <div class="legend">
        <span><i class="f"></i>선택 가능</span>
        <span><i class="m"></i>우리가 확보</span>
        <span><i class="o"></i>다른 참여사 확보</span>
        <span><i class="s"></i>주최측 지정(내빈석 등)</span>
      </div>
    </div>

    <div class="form" id="formBox">
      <h3>담당자</h3>
      <p class="sub">확보 내용을 확인할 때 연락드릴 분입니다. 좌석과 함께 저장됩니다.</p>
      <div class="row">
        <div>
          <label for="cName">담당자 이름</label>
          <input type="text" id="cName" placeholder="홍길동" autocomplete="name" />
        </div>
        <div>
          <label for="cPhone">연락처</label>
          <input type="tel" id="cPhone" placeholder="010-0000-0000" autocomplete="tel" />
        </div>
      </div>
    </div>

  </div>
</div>

<div class="bar" id="bar" hidden>
  <div class="in">
    <div class="n">
      확보 <b id="nMine">0</b><span id="nMax"></span>
      <span class="sep">·</span>
      일반 공개 <b id="nPublic">—</b>석
    </div>
    <span class="msg" id="msg"></span>
    <div class="acts">
      <button class="ghost" id="resetBtn" type="button">되돌리기</button>
      <button class="save" id="saveBtn" type="button">저장</button>
    </div>
  </div>
</div>

<!-- 버전 표시 : vercel.json 이 js 를 1시간 캐시한다. 확보 기간 중 수정하면
     참여사가 옛 화면을 쓰게 되므로, 고칠 때마다 v= 값을 올린다. -->
<script src="js/config.js?v=20260917a"></script>
<script src="js/hold.js?v=20260917a"></script>
</body>
</html>
