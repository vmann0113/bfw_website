<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>현장등록 | 2026 부산패션위크</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />

<style>
  /* 행사장에서 휴대폰으로 보는 화면이다. 글자와 누르는 칸을 크게 둔다. */
  :root{
    --navy:#0a1f54; --mint:#5ee0c8; --ink:#16224a; --mute:#5d6a8c;
    --line:#dfe4f0; --bg:#f4f6fb;
    --kr:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
    --num:'Oswald',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--kr);background:var(--bg);color:var(--ink);line-height:1.6;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 60px}

  header{background:var(--navy);color:#fff;margin:0 -16px 18px;padding:26px 24px 24px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;
    background:linear-gradient(140deg,rgba(94,224,200,.32),transparent 70%);transform:rotate(18deg)}
  .eyebrow{font-family:var(--num);font-size:12px;letter-spacing:.2em;color:var(--mint)}
  header h1{margin-top:9px;font-size:25px;font-weight:800;letter-spacing:-.03em}
  header p{margin-top:8px;font-size:14px;color:#c3d2f2}

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}

  .now{background:var(--navy);color:#fff;border:0}
  .now .lab{font-family:var(--num);font-size:11px;letter-spacing:.16em;color:var(--mint)}
  .now .ttl{margin-top:8px;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
  .now .sub{margin-top:6px;font-size:14px;color:#c3d2f2}
  .now .time{margin-top:14px;font-family:var(--num);font-size:34px;font-weight:600;line-height:1}

  .stand{display:flex;gap:10px;align-items:flex-start;background:#fff6e5;border:1px solid #f0dcae;
    border-radius:12px;padding:14px;font-size:14px;color:#6b4e00;margin-bottom:14px}
  .stand b{display:block;color:#8a5300}

  label.f{display:block;font-size:14px;font-weight:700;margin:16px 0 7px}
  input[type=text],input[type=tel]{width:100%;border:1.5px solid var(--line);border-radius:11px;
    padding:15px 14px;font-family:inherit;font-size:17px;background:#fff;color:var(--ink)}
  input:focus{outline:none;border-color:var(--navy)}
  input.bad{border-color:#d7263d;background:#fff5f6}
  .agree{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:14px;color:var(--mute)}
  .agree input{width:20px;height:20px;margin-top:2px;accent-color:var(--navy);flex:none}
  .agree b{color:var(--ink)}
  .privacy{margin-top:9px;font-size:12.5px;color:var(--mute);background:var(--bg);
    border-radius:10px;padding:12px 13px;line-height:1.6}
  button.go{width:100%;margin-top:18px;background:var(--navy);color:#fff;border:0;border-radius:12px;
    padding:18px;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer}
  button.go:disabled{opacity:.5}
  .err{margin-top:12px;color:#b3122a;font-size:14.5px;display:none}

  /* 완료 — 스태프에게 보여주는 화면이라 크고 분명하게 */
  .done{min-height:100vh;margin:0 -16px;padding:0 24px;background:var(--mint);color:#06204a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .done .big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
  .done .who{margin-top:16px;font-size:21px;font-weight:700}
  .done .what{margin-top:6px;font-size:15px}
  .done .line{margin-top:26px;background:#06204a;color:#fff;border-radius:999px;
    padding:12px 22px;font-size:15px;font-weight:700}
  .done .hint{margin-top:18px;font-size:13.5px;color:#0a3b57}

  .notice{text-align:center;padding:44px 20px}
  .notice h2{font-size:20px;margin-bottom:10px}
  .notice p{color:var(--mute);font-size:15px}
  .notice .when{margin-top:16px;font-family:var(--num);font-size:26px;color:var(--navy);font-weight:600}
  .hidden{display:none}
  footer{margin-top:24px;text-align:center;font-size:12px;color:#8e9ab8;line-height:1.7}
</style>
</head>
<body>

<div id="doneWrap" class="hidden">
  <div class="done">
    <div class="big">등록 완료<br>바로 입장하세요</div>
    <div class="who" id="dName"></div>
    <div class="what" id="dShow"></div>
    <div class="line">현장등록 입장줄</div>
    <div class="hint">이 화면을 입구 스태프에게 보여주세요</div>
  </div>
</div>

<div id="main">
  <header>
    <div class="eyebrow">WALK-IN</div>
    <h1>현장등록</h1>
    <p>예약 없이 오신 분을 위한 당일 등록입니다</p>
  </header>

  <div class="wrap">
    <div class="notice" id="loading"><p>불러오는 중…</p></div>

    <div id="form" class="hidden">
      <div class="card now">
        <div class="lab">지금 등록하는 패션쇼</div>
        <div class="ttl" id="sTitle"></div>
        <div class="sub" id="sSub"></div>
        <div class="time" id="sTime"></div>
      </div>

      <div class="stand">
        <div><b>좌석 없는 스탠딩 관람입니다</b>
        앉으실 자리는 없으며, 뒤편 스탠드 구역에서 서서 관람하십니다.</div>
      </div>

      <div class="card">
        <label class="f" for="wName">이름</label>
        <input type="text" id="wName" placeholder="홍길동" autocomplete="name" />
        <label class="f" for="wPhone">연락처</label>
        <input type="tel" id="wPhone" placeholder="010-0000-0000" autocomplete="tel" inputmode="numeric" />

        <label class="agree"><input type="checkbox" id="wAgree" />
          <span><b>[필수]</b> 개인정보 수집·이용에 동의합니다</span></label>
        <div class="privacy">
          수집 항목 : 이름 · 연락처<br>
          이용 목적 : 입장 확인과 다음 행사 안내<br>
          보관 기간 : 1년
        </div>

        <button class="go" id="goBtn" type="button">등록하고 입장하기</button>
        <div class="err" id="errBox"></div>
      </div>
    </div>

    <div id="notice" class="notice hidden">
      <h2 id="nTitle"></h2>
      <p id="nBody"></p>
      <div class="when" id="nWhen"></div>
    </div>

    <footer>
      2026 부산패션위크 · 벡스코 제1전시장 3B홀<br>
      주최 부산광역시 · 주관 (사)부산섬유패션산업연합회
    </footer>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/walkin.js?v=20261005"></script>
</body>
</html>
